<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111528" />
  <title>NEXORA — Social</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="ambient"></div>
  <main id="app" class="shell">
    <section id="loginView" class="login-screen hidden"></section>
    <section id="appView" class="app-view hidden">
      <header class="topbar glass">
        <button class="icon-btn" data-action="toggle-menu" aria-label="القائمة">☰</button>
        <div class="brand"><span class="brand-mark">N</span><div><strong>NEXORA</strong><small>social · live · store</small></div></div>
        <button class="avatar mini" id="topAvatar" data-page="profile" aria-label="الملف الشخصي"></button>
      </header>
      <div class="layout">
        <aside id="sidebar" class="sidebar glass">
          <nav>
            <button data-page="home" class="nav-item active"><span>⌂</span> الرئيسية</button>
            <button data-page="profile" class="nav-item"><span>◉</span> الملف الشخصي</button>
            <button data-page="messages" class="nav-item"><span>◌</span> الرسائل</button>
            <button data-page="store" class="nav-item"><span>▱</span> المتجر</button>
            <button data-page="menu" class="nav-item"><span>☷</span> القائمة</button>
          </nav>
          <div class="sidebar-note">لا توجد منشورات أو رسائل تجريبية. كل المحتوى يظهر بعد إضافة مستخدمين وبيانات حقيقية.</div>
        </aside>
        <section class="content" id="content"></section>
      </div>
      <nav class="mobile-nav glass">
        <button data-page="home">⌂<small>الرئيسية</small></button>
        <button data-page="messages">◌<small>الرسائل</small></button>
        <button data-page="store">▱<small>المتجر</small></button>
        <button data-page="profile">◉<small>ملفي</small></button>
        <button data-page="menu">☷<small>القائمة</small></button>
      </nav>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <div id="modalRoot"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js" type="module"></script>
</body>
</html>
